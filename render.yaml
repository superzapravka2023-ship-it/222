services:
  - type: worker
    name: bybit-short-hunter
    env: python
    pythonVersion: "3.11"
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DB_PATH
        value: /data/bot.db
    disk:
      name: bot-data
      mountPath: /data
      sizeGB: 1
